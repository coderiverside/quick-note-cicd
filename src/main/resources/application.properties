# ---------------------------------------------------------------------------
# Notes Management API
#
# Environment-specific values are set only in the %prod profile and every one of
# them reads an environment variable (constitution: Architecture & Technology
# Standards forbids hard-coded connection strings / issuer URLs).
#
# In dev and test these properties are deliberately left unset so Quarkus Dev
# Services provisions a real PostgreSQL and a real Keycloak container instead
# (research.md 12 rejects in-memory or mocked substitutes for either).
# ---------------------------------------------------------------------------

quarkus.http.root-path=/

# --- Persistence (schema is owned exclusively by Flyway, never auto-generated) ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- Security: Keycloak OIDC resource server --------------------------------
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:notes-api}

# RBAC gate applied uniformly to every application endpoint rather than repeated
# as a per-method annotation, so a new endpoint cannot be added unprotected by
# omission (research.md 1b, constitution Principle II).
quarkus.security.jaxrs.default-roles-allowed=user

# --- Observability ----------------------------------------------------------
quarkus.log.console.json=true
quarkus.log.console.json.additional-field."service.name".value=notes-api
quarkus.micrometer.export.prometheus.enabled=true

# --- Trash auto-purge (FR-014) ----------------------------------------------
# How long a trashed note remains restorable before permanent deletion.
quicknote.trash.retention-days=${TRASH_RETENTION_DAYS:7}
quicknote.trash.purge-cron=${TRASH_PURGE_CRON:0 0 3 * * ?}

# --- Pagination bounds (constitution Principle VII) -------------------------
quicknote.pagination.default-size=20
quicknote.pagination.max-size=100

# ---------------------------------------------------------------------------
# Production: everything externalized to environment variables.
# ---------------------------------------------------------------------------
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.tls.verification=${OIDC_TLS_VERIFICATION:required}

# ---------------------------------------------------------------------------
# Dev and test: Dev Services start PostgreSQL and Keycloak. Keycloak imports the
# very same realm file docker-compose uses, so the realm, client and role
# mapping under test are the real ones rather than a test-only approximation.
# ---------------------------------------------------------------------------
%dev.quarkus.keycloak.devservices.realm-path=docker/keycloak/quicknote-realm.json
%dev.quarkus.keycloak.devservices.realm-name=quicknote
%dev.quarkus.log.console.json=false

%test.quarkus.keycloak.devservices.realm-path=docker/keycloak/quicknote-realm.json
%test.quarkus.keycloak.devservices.realm-name=quicknote
%test.quarkus.log.console.json=false
