name: CI

on:
    push:
        branches:
          - main
          - develop
    pull_request:
        branches:
          - main
          - develop

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest
        steps:
            - name : Checkout source code
              uses: actions/checkout@v7

            - name : Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven

            - name : Build and test with Maven
              run: ./mvnw -B clean verify

            # The reports for the failing tests are the whole point of this step,
            # so it must run on failure too.
            - name : Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: target/surefire-reports/
                  if-no-files-found: warn
                  retention-days: 7

            # Uploaded even when verify fails, so a coverage-threshold failure can
            # be diagnosed from the report instead of from the build log alone.
            - name : Upload JaCoCo coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: jacoco-report
                  path: target/jacoco-report
                  if-no-files-found: warn
                  retention-days: 7

            # Informative only: this action never fails the job. The gate is
            # jacoco:check in the pom, which already ran during verify.
            - name : Publish coverage summary on the pull request
              if: github.event_name == 'pull_request'
              uses: madrapps/jacoco-report@v1.8.0
              with:
                  paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
                  token: ${{ secrets.GITHUB_TOKEN }}
                  title: Code coverage
                  update-comment: true
                  # LINE to match the pom rule; the action defaults to INSTRUCTION,
                  # which would report a different number under the same threshold.
                  coverage-counter-type: LINE
                  # Keep in sync with jacoco.line-coverage.minimum in pom.xml.
                  min-coverage-overall: 85
                  min-coverage-changed-lines: 80

            # No `if:`, so this is skipped when an earlier step fails: a runnable
            # artifact is only published for a build that passed tests, coverage
            # and format checks. `error` turns a packaging regression into a
            # failure instead of an empty artifact nobody notices.
            - name : Upload application artifact
              uses: actions/upload-artifact@v7
              with:
                  name: quick-note-app
                  path: target/quarkus-app/
                  if-no-files-found: error
                  retention-days: 7
