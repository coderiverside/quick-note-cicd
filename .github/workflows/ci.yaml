name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build: 
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven 
      
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check 

      - name: Build and test with Maven
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true 

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
            name: test-reports
            path: target/surefire-reports/
            if-no-files-found: warn
            retention-days: 7

      # Also on failure: a coverage-threshold breach is diagnosed from the
      # report, not from the build log.
      - name : Upload JaCoCo coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
            name: jacoco-report
            path: target/jacoco-report
            if-no-files-found: warn
            retention-days: 7