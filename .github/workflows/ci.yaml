name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build: 
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven 
      
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check 

      - name: Build and test with Maven
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true 

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
            name: test-reports
            path: target/surefire-reports/
            if-no-files-found: warn
            retention-days: 7

      # Also on failure: a coverage-threshold breach is diagnosed from the
      # report, not from the build log.
      - name : Upload JaCoCo coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
            name: jacoco-report
            path: target/jacoco-report
            if-no-files-found: warn
            retention-days: 7
      
      # Read from the pom so the numbers cannot drift from the gate.
      - name : Read coverage thresholds from the POM
        id: thresholds
        if: github.event_name == 'pull_request'
        run: |
            overall=$(./mvnw -B -ntp -q help:evaluate -Dexpression=jacoco.line-coverage.minimum -DforceStdout)
            changed=$(./mvnw -B -ntp -q help:evaluate -Dexpression=jacoco.changed-lines-coverage.minimum -DforceStdout)
            echo "overall=$(awk "BEGIN { print $overall * 100 }")" >> "$GITHUB_OUTPUT"
            echo "changed=$(awk "BEGIN { print $changed * 100 }")" >> "$GITHUB_OUTPUT"

      # Informative only: it never fails the job. The gate is jacoco:check
      # in the pom, which already ran during verify.
      - name : Publish coverage summary on the pull request
        if: github.event_name == 'pull_request'
        # SHA-pinned: third-party action holding a PR-write token.
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
            paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
            token: ${{ secrets.GITHUB_TOKEN }}
            title: Code coverage
            update-comment: true
            coverage-counter-type: LINE
            min-coverage-overall: ${{ steps.thresholds.outputs.overall }}
            min-coverage-changed-lines: ${{ steps.thresholds.outputs.changed }}
