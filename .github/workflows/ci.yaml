name: CI

on:
    push:
        branches:
          - main
          - develop
    pull_request:
        branches:
          - main
          - develop

permissions:
    contents: read

# Only pull requests are cancelled: a push run produces the artifact.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            # Only the coverage comment writes, so the scope stops at this job.
            pull-requests: write
        steps:
            - name : Checkout source code
              uses: actions/checkout@v7

            - name : Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven

            # Before the suite: spotless is bound to verify, so a misplaced
            # import would otherwise fail only after minutes of tests.
            - name : Check formatting
              run: ./mvnw -B -ntp spotless:check

            # Spotless already ran; the pom binds it to verify for local builds.
            - name : Build and test with Maven
              run: ./mvnw -B -ntp verify -Dspotless.check.skip=true

            # Runs on failure too: the reports of the failing tests are the point.
            - name : Upload test reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: target/surefire-reports/
                  if-no-files-found: warn
                  retention-days: 7

            # Also on failure: a coverage-threshold breach is diagnosed from the
            # report, not from the build log.
            - name : Upload JaCoCo coverage report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: jacoco-report
                  path: target/jacoco-report
                  if-no-files-found: warn
                  retention-days: 7

            # Read from the pom so the numbers cannot drift from the gate.
            - name : Read coverage thresholds from the POM
              id: thresholds
              if: github.event_name == 'pull_request'
              run: |
                  overall=$(./mvnw -B -ntp -q help:evaluate -Dexpression=jacoco.line-coverage.minimum -DforceStdout)
                  changed=$(./mvnw -B -ntp -q help:evaluate -Dexpression=jacoco.changed-lines-coverage.minimum -DforceStdout)
                  echo "overall=$(awk "BEGIN { print $overall * 100 }")" >> "$GITHUB_OUTPUT"
                  echo "changed=$(awk "BEGIN { print $changed * 100 }")" >> "$GITHUB_OUTPUT"

            # Informative only: it never fails the job. The gate is jacoco:check
            # in the pom, which already ran during verify.
            - name : Publish coverage summary on the pull request
              if: github.event_name == 'pull_request'
              # SHA-pinned: third-party action holding a PR-write token.
              uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
              with:
                  paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
                  token: ${{ secrets.GITHUB_TOKEN }}
                  title: Code coverage
                  update-comment: true
                  coverage-counter-type: LINE
                  min-coverage-overall: ${{ steps.thresholds.outputs.overall }}
                  min-coverage-changed-lines: ${{ steps.thresholds.outputs.changed }}

            - name : Upload application artifact
              uses: actions/upload-artifact@v7
              with:
                  name: quick-note-app
                  path: target/quarkus-app/
                  if-no-files-found: error
                  retention-days: 7

    image:
        name: Build container image
        needs: build
        runs-on: ubuntu-latest
        # Nothing compiles here; the cost is pulling the base image.
        timeout-minutes: 15
        steps:
            - name : Checkout source code
              uses: actions/checkout@v7

            # Reuses the fast-jar from build instead of recompiling the commit.
            - name : Download application artifact
              uses: actions/download-artifact@v7
              with:
                  name: quick-note-app
                  path: target/quarkus-app

            - name : Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Not pushed: `load: true` is all the check below needs.
            - name : Build Docker Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: src/main/docker/Dockerfile.jvm
                  push: false
                  load: true
                  tags: notes-api:${{ github.sha }}

            # Catches a Quarkus upgrade renaming one of the four copied paths.
            # Booting the application would need Postgres and Keycloak, so that
            # belongs to an integration job.
            - name : Verify the image layout
              run: |
                  # --entrypoint leaves USER alone, so the tests below are
                  # answered with the permissions the application will have.
                  docker run --rm --entrypoint /bin/sh notes-api:${{ github.sha }} -c '
                      test -f /deployments/quarkus-run.jar || { echo "missing /deployments/quarkus-run.jar"; exit 1; }
                      test -r /deployments/quarkus-run.jar || { echo "/deployments/quarkus-run.jar not readable by uid $(id -u)"; exit 1; }
                      for dir in lib app quarkus; do
                          test -d "/deployments/$dir" || { echo "missing /deployments/$dir"; exit 1; }
                          test -r "/deployments/$dir" && test -x "/deployments/$dir" || { echo "/deployments/$dir not usable by uid $(id -u)"; exit 1; }
                      done
                      # Guards the Dockerfile, not the copy: a regenerated
                      # template that moves USER off 185 lands here.
                      test "$(id -u)" = "185" || { echo "expected uid 185, got $(id -u)"; exit 1; }
                      java -version
                  '
