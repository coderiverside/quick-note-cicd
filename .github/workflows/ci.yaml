name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build: 
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven 
      
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check 

      - name: Build and test with Maven
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true 

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
            name: test-reports
            path: target/surefire-reports/
            if-no-files-found: warn
            retention-days: 7

      # Also on failure: a coverage-threshold breach is diagnosed from the
      # report, not from the build log.
      - name : Upload JaCoCo coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
            name: jacoco-report
            path: target/jacoco-report
            if-no-files-found: warn
            retention-days: 7
      
      # Read from the pom so the numbers cannot drift from the gate.
      - name : Read coverage thresholds from the POM
        id: thresholds
        if: github.event_name == 'pull_request'
        run: |
            overall=$(./mvnw -B -ntp -q help:evaluate -Dexpression=jacoco.line-coverage.minimum -DforceStdout)
            changed=$(./mvnw -B -ntp -q help:evaluate -Dexpression=jacoco.changed-lines-coverage.minimum -DforceStdout)
            echo "overall=$(awk "BEGIN { print $overall * 100 }")" >> "$GITHUB_OUTPUT"
            echo "changed=$(awk "BEGIN { print $changed * 100 }")" >> "$GITHUB_OUTPUT"

      # Informative only: it never fails the job. The gate is jacoco:check
      # in the pom, which already ran during verify.
      - name: Publish coverage summary on the pull request
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
            paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
            token: ${{ secrets.GITHUB_TOKEN }}
            title: Code coverage
            update-comment: true
            min-coverage-overall: ${{ steps.thresholds.outputs.overall }}
            min-coverage-changed-files: ${{ steps.thresholds.outputs.changed }}

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
            name: quick-note-api
            path: target/quarkus-app/
            if-no-files-found: error
            retention-days: 7

  image:
    name: Build container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download application artifact
        uses: actions/download-artifact@v7
        with:
          name: quick-note-api
          path: target/quarkus-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build locally first, so the image can be verified before publishing.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: false
          load: true
          tags: quick-note-api:${{ github.sha }}
      
      # Verify the image before publishing it.
      - name: Verify the image layout
        run: |
            docker run --rm --entrypoint /bin/sh quick-note-api:${{ github.sha }} -c '
                test -f /deployments/quarkus-run.jar || { echo "missing /deployments/quarkus-run.jar"; exit 1; }
                test -r /deployments/quarkus-run.jar || { echo "/deployments/quarkus-run.jar not readable by uid $(id -u)"; exit 1; }
                for dir in lib app quarkus; do
                    test -d "/deployments/$dir" || { echo "missing /deployments/$dir"; exit 1; }
                    test -r "/deployments/$dir" && test -x "/deployments/$dir" || { echo "/deployments/$dir not usable by uid $(id -u)"; exit 1; }
                done
                test "$(id -u)" = "185" || { echo "expected uid 185, got $(id -u)"; exit 1; }
                java -version
            '
      
      # AWS authentication is only needed for pushes, not pull requests.
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::734143850199:role/GitHubActionsQuickNoteApiECRRole
          aws-region: us-west-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: coderiverside/quick-note-cicd
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag quick-note-api:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}